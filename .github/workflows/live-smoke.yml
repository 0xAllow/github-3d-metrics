name: Live GitHub API smoke test
on:
  workflow_dispatch:
    inputs:
      username:
        description: Public GitHub account for the smoke test
        default: octocat
        required: true
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate real public metrics in the runner's temporary directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METRICS_USERNAME: ${{ inputs.username }}
        run: |
          scratch="$(mktemp -d)"
          node src/cli.ts --root "$scratch" --options '{"view":"stats"}'
          test -s "$scratch/assets/github-3d-metrics.svg"
          node src/cli.ts --root "$scratch" --options '{"view":"city"}'
          test -s "$scratch/assets/github-3d-metrics.svg"
          node src/cli.ts --root "$scratch" --options '{"view":"city"}'
